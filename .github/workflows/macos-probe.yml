name: macOS Python socket probe

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run local-only probe
        run: python probe.py
      - name: Upload generic probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-python-probe-result
          path: probe-result.json
